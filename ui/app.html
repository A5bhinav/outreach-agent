<!doctype html>
<html lang="en">

<title>Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b57d0'/%3E%3Cpath d='M7 25l20-9L7 7v7l14 2-14 2z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Same Gmail (Material 3) tokens as the review inbox (ui/review.html). */
:root {
  --bg: #f6f8fc; --surface: #ffffff; --read: #f2f6fc; --line: #e0e3e7; --line-2: #eceff1;
  --ink: #1f1f1f; --ink-2: #444746; --ink-3: #5e5e5e; --ink-4: #747775;
  --primary: #0b57d0; --primary-ink: #ffffff; --nav-sel: #d3e3fd; --nav-sel-ink: #001d35; --fab: #c2e7ff; --fab-ink: #001d35;
  --field: #f0f4f9; --draft: #d93025;
  --warn-bg: #fef7e0; --warn-ink: #7a4f01; --bad-bg: #fce8e6; --bad-ink: #a50e0e; --ok-bg: #e6f4ea; --ok-ink: #0d652d;
  --row-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --pop-shadow: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  --sans: "Google Sans Text", "Google Sans", Roboto, Arial, sans-serif; --display: "Google Sans", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --surface: #1f1f1f; --read: #262626; --line: #3c4043; --line-2: #2e3134;
  --ink: #e3e3e3; --ink-2: #c4c7c5; --ink-3: #a8abaf; --ink-4: #8e918f;
  --primary: #a8c7fa; --primary-ink: #062e6f; --nav-sel: #004a77; --nav-sel-ink: #c2e7ff; --fab: #004a77; --fab-ink: #c2e7ff;
  --field: #28292a; --draft: #f28b82;
  --warn-bg: #3d2f0a; --warn-ink: #fdd663; --bad-bg: #3c1f1d; --bad-ink: #f6aea9; --ok-bg: #0f3d22; --ok-ink: #81c995;
  --row-shadow: inset 0 0 0 1px #3c4043; --pop-shadow: 0 4px 12px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1f1f1f; --read: #262626; --line: #3c4043; --line-2: #2e3134;
  --ink: #e3e3e3; --ink-2: #c4c7c5; --ink-3: #a8abaf; --ink-4: #8e918f;
  --primary: #a8c7fa; --primary-ink: #062e6f; --nav-sel: #004a77; --nav-sel-ink: #c2e7ff; --fab: #004a77; --fab-ink: #c2e7ff;
  --field: #28292a; --draft: #f28b82;
  --warn-bg: #3d2f0a; --warn-ink: #fdd663; --bad-bg: #3c1f1d; --bad-ink: #f6aea9; --ok-bg: #0f3d22; --ok-ink: #81c995;
  --row-shadow: inset 0 0 0 1px #3c4043; --pop-shadow: 0 4px 12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/20px var(--sans); }
a { color: var(--primary); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, textarea, select { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.ib:hover { background: rgba(68,71,70,.08); }

header { height: 64px; display: flex; align-items: center; padding: 8px 8px 8px 16px; gap: 4px; }
.logo { display: flex; align-items: center; gap: 8px; width: 222px; padding-left: 4px; color: inherit; }
.logo:hover { text-decoration: none; }
.logo .mk { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #4285f4, #0b57d0); display: grid; place-items: center; }
.logo .mk svg { width: 18px; height: 18px; fill: #fff; }
.logo span { font: 22px/24px var(--display); color: var(--ink-2); }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-right: 8px; }
.status-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 16px; background: var(--nav-sel); color: var(--nav-sel-ink); text-decoration: none !important; }
.status-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

.shell { display: flex; min-height: calc(100vh - 64px); }
nav { width: 256px; flex: none; padding-right: 16px; }
.fab { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 16px; margin: 8px 0 16px 8px; border: 0; border-radius: 16px; background: var(--fab); color: var(--fab-ink); font: 500 14px var(--display); cursor: pointer; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); text-decoration: none !important; }
.fab:hover { box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); }
.nv { display: flex; align-items: center; height: 32px; padding: 0 12px 0 26px; border-radius: 0 16px 16px 0; color: var(--ink); gap: 18px; text-decoration: none !important; }
.nv:hover { background: rgba(31,31,31,.06); }
.nv[aria-current="page"] { background: var(--nav-sel); color: var(--nav-sel-ink); font-weight: 700; }
.nv .lbl { flex: 1; } .nv .cnt { font-size: 12px; }
.nv .warn { width: 8px; height: 8px; border-radius: 50%; background: var(--draft); }
.main { flex: 1; min-width: 0; background: var(--surface); border-radius: 16px; margin: 0 16px 16px 0; padding: 28px 40px 48px; }
.page { max-width: 880px; }
h1 { font: 400 28px/36px var(--display); margin: 0 0 4px; }
.sub { color: var(--ink-3); margin: 0 0 24px; }
h2 { font: 500 16px/24px var(--display); margin: 28px 0 12px; }

/* form controls */
label.f { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin: 16px 0 6px; }
.help { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
input.t, textarea.t, select.t { width: 100%; border: 1px solid transparent; background: var(--field); border-radius: 12px; padding: 12px 14px; outline: none; }
input.t:focus, textarea.t:focus, select.t:focus { background: var(--surface); border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
textarea.t { resize: vertical; min-height: 84px; line-height: 20px; }
textarea.big { min-height: 120px; font-size: 16px; line-height: 24px; padding: 16px; }
.ph-warn { border-color: #f9ab00 !important; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.btn { height: 40px; padding: 0 24px; border-radius: 20px; border: 1px solid var(--ink-4); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--primary); cursor: pointer; text-decoration: none !important; white-space: nowrap; }
.btn:hover { background: rgba(11,87,208,.06); }
.btn.fill { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.fill:hover { box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); filter: brightness(1.05); }
.btn.tonal { background: var(--fab); border-color: transparent; color: var(--fab-ink); }
.btn.danger { color: var(--draft); border-color: var(--line); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg.i { width: 18px; height: 18px; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.actions .grow { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.chip:hover { background: var(--read); }
.chip[aria-pressed="true"] { background: var(--nav-sel); border-color: transparent; color: var(--nav-sel-ink); }
.chip svg.i { width: 18px; height: 18px; }
.chip .tiny { width: 8px; height: 8px; border-radius: 50%; background: var(--draft); }
.seg { display: inline-flex; border: 1px solid var(--ink-4); border-radius: 20px; overflow: hidden; }
.seg button { height: 40px; min-width: 64px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--ink-4); }
.seg button[aria-pressed="true"] { background: var(--nav-sel); color: var(--nav-sel-ink); }
.switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--line); border: 2px solid var(--ink-4); position: relative; cursor: pointer; margin: 0; flex: none; }
.switch input::after { content: ""; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-4); transition: .15s; }
.switch input:checked { background: var(--primary); border-color: var(--primary); }
.switch input:checked::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--primary-ink); }
.examples { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.examples button { text-align: left; border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 4px 0; font-size: 13px; }
.examples button:hover { color: var(--primary); }
.examples button b { color: var(--ink-2); font-weight: 500; }

/* banners & cards */
.banner { padding: 12px 16px; border-radius: 12px; display: flex; gap: 12px; margin: 16px 0; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); } .banner.bad { background: var(--bad-bg); color: var(--bad-ink); } .banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
.banner ul { margin: 4px 0 0; padding-left: 18px; } .banner a { color: inherit; text-decoration: underline; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px; margin-top: 20px; }
.card h3 { margin: 0 0 4px; font: 500 18px var(--display); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lb { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; background: var(--line-2); color: var(--ink-2); }
.lb.blue { background: var(--nav-sel); color: var(--nav-sel-ink); } .lb.ok { background: var(--ok-bg); color: var(--ok-ink); }
.lb.bad { background: var(--bad-bg); color: var(--bad-ink); } .lb.warn { background: var(--warn-bg); color: var(--warn-ink); }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; margin-top: 12px; }
.plan-grid h4 { margin: 12px 0 6px; font: 500 12px var(--sans); text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); }
.plan-grid ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.plan-grid li { display: flex; gap: 8px; } .plan-grid li svg.i { width: 18px; height: 18px; color: var(--ink-4); margin-top: 1px; }
.plan-grid li.must svg.i { color: #f4b400; }
.est { display: flex; gap: 28px; flex-wrap: wrap; padding: 14px 0 0; margin-top: 16px; border-top: 1px solid var(--line-2); }
.est div { display: flex; flex-direction: column; } .est b { font: 400 22px var(--display); } .est span { font-size: 12px; color: var(--ink-3); }

/* lists */
.rows { border-top: 1px solid var(--line-2); margin: 0 -40px; }
.r { display: flex; align-items: center; gap: 16px; padding: 0 40px; min-height: 56px; box-shadow: inset 0 -1px 0 0 var(--line-2); cursor: pointer; color: inherit; text-decoration: none !important; position: relative; }
.r:hover { box-shadow: var(--row-shadow); z-index: 1; }
.r .main-col { flex: 1; min-width: 0; }
.r .t1 { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r .t2 { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r .side { font-size: 12px; color: var(--ink-3); white-space: nowrap; text-align: right; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 500 15px var(--display); flex: none; }
.empty { padding: 56px 24px; text-align: center; color: var(--ink-3); }
.empty b { display: block; font: 400 22px var(--display); color: var(--ink-2); margin-bottom: 6px; }

/* run progress */
.steps { display: flex; gap: 0; margin: 24px 0 8px; }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; font-size: 12px; color: var(--ink-3); text-align: center; }
.step::before { content: ""; position: absolute; top: 13px; left: -50%; right: 50%; height: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step .b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--line); z-index: 1; }
.step.done .b { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.step.done::before, .step.now::before { background: var(--primary); }
.step.now .b { border-color: var(--primary); } .step.now .b::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; }
.step.now { color: var(--ink); font-weight: 500; }
.step .b svg.i { width: 16px; height: 16px; }
.counts { display: flex; gap: 32px; margin: 20px 0 4px; }
.counts div { display: flex; flex-direction: column; } .counts b { font: 400 28px var(--display); } .counts span { font-size: 12px; color: var(--ink-3); }
details.log { margin-top: 24px; }
details.log summary { cursor: pointer; color: var(--ink-3); font-size: 13px; }
details.log pre { background: var(--read); border-radius: 12px; padding: 12px 16px; max-height: 320px; overflow: auto; font: 12px/18px ui-monospace, Menlo, monospace; white-space: pre-wrap; margin: 8px 0 0; color: var(--ink-2); }

.snack { position: fixed; left: 24px; bottom: 24px; background: #303030; color: #f2f2f2; padding: 14px 16px; border-radius: 4px; box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.14); transform: translateY(80px); opacity: 0; transition: .2s; z-index: 30; }
.snack.show { transform: none; opacity: 1; }
.list-editor .li { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.list-editor .li input { flex: 1; }
.role { display: grid; grid-template-columns: 1.4fr 1fr 1fr 40px; gap: 8px; margin-bottom: 8px; }
.role textarea { grid-column: 1 / 4; min-height: 44px; }
.spinner { width: 18px; height: 18px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  nav { display: none; } body.drawer nav { display: block; position: fixed; z-index: 15; top: 0; bottom: 0; left: 0; background: var(--bg); padding-top: 8px; box-shadow: var(--pop-shadow); }
  .logo { width: auto; } .main { margin: 0 8px 8px; padding: 20px 16px 40px; }
  .rows { margin: 0 -16px; } .r { padding: 0 16px; }
  .row2, .plan-grid { grid-template-columns: 1fr; }
  .steps .step span { display: none; }
  .role { grid-template-columns: 1fr 40px; } .role input:not(:first-child) { grid-column: 1; } .role textarea { grid-column: 1; }
}
</style>
</head>

<div class="shell">

</div>

const colorOf = (s) => PAL[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % PAL.length];
const ini = (s) => (String(s).replace(/[^A-Za-z ]/g, "").trim()[0] || "?").toUpperCase();
const ls = { get(k, d) { try { const v = localStorage.getItem("outreach-app:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem("outreach-app:" + k, JSON.stringify(v)); } catch (e) {} } };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-Outreach": "1", ...(opts.headers || {}) },
                                  body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
let snackT;
function snack(msg) { const s = $("snack"); s.textContent = msg; s.classList.add("show"); clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove("show"), 3500); }

async function preview() {

  try {
    planned = await api("/api/plan", { method: "POST", body: { company: draft.company, request: draft.request, n: draft.n, demo: draft.demo } });
    showPlan();
  } catch (e) { $("plan").innerHTML = `<div class="banner bad">${I("warn")}<div>${esc(e.message)}</div></div>`; }
  finally { b.disabled = false; b.textContent = "Preview plan"; $("planmsg").textContent = ""; }

const STATUS = { running: ["blue", "Running"], done: ["ok", "Done"], error: ["bad", "Failed"], cancelled: ["", "Stopped"], incomplete: ["warn", "Incomplete"] };
async function pageRuns() {
  $("page").innerHTML = `<h1>Runs</h1><p class="sub">Every request you've run. Open one to review and send its drafts.</p><div class="rows" id="runlist"><div class="empty">Loading…</div></div>`;

  $("runlist").innerHTML = runs.length ? runs.map((r) => {
    const [cls, label] = STATUS[r.status] || ["", r.status];
    const href = r.status !== "running" && r.has_inbox ? `/runs/${encodeURIComponent(r.id)}/results.html` : `#/runs/${encodeURIComponent(r.id)}`;
    return `<a class="r" href="${href}">
      <div class="av" style="background:${colorOf(r.company)}">${esc(ini(r.company))}</div>
      <div class="main-col"><div class="t1">${esc(r.company)}${r.demo ? ' <span class="lb warn">Demo</span>' : ""}</div><div class="t2">${esc(r.request)}</div></div>
      <span class="lb ${cls}">${label}</span>
      <div class="side">${r.targets ? `<b style="color:var(--ink)">${r.ready}</b> of ${r.targets} ready` : "—"}<br>${esc(new Date(r.started).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}</div></a>`;
  }).join("") : `<div class="empty"><b>No runs yet</b><a href="#/new">Start a request</a> to see it here.</div>`;
}
const STAGES = [["Plan", /planner|preflight/], ["Search", /sourcer/], ["Research", /researcher|people:/], ["Contacts", /contacts|skip:/], ["Write", /writer/], ["Review", /reviewer|✓|·/]];
let poll, logLen = 0, logText = "";
async function pageRun(id) {
  clearTimeout(poll); logLen = 0; logText = "";
  $("page").innerHTML = `<div id="runhead"></div><div id="runbody"></div>`;
  const tick = async () => {
    let d;
    try { d = await api(`/api/runs/${encodeURIComponent(id)}?since=${logLen}`); } catch (e) { $("runbody").innerHTML = `<div class="banner bad">${I("warn")}<div>${esc(e.message)}</div></div>`; return; }
    if (route()[0] !== "runs" || route()[1] !== id) return;
    const job = d.job, status = job ? job.status : d.status;
    if (job) { logText += job.log.map((l) => l + "\n").join(""); logLen = job.log_len; }
    const lines = logText.split("\n");
    let stage = -1;
    lines.forEach((l) => STAGES.forEach(([, re], i) => { if (re.test(l)) stage = Math.max(stage, i); }));
    if (status === "done") stage = STAGES.length;
    const [cls, label] = STATUS[status] || ["", status];
    $("runhead").innerHTML = `<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h1 style="flex:1;min-width:0">${esc(d.company || "Run")}</h1><span class="lb ${cls}">${label}</span>${d.demo ? '<span class="lb warn">Demo data</span>' : ""}</div>
      <p class="sub">${esc(d.request || "")}</p>`;
    const live = d.live || [];
    $("runbody").innerHTML = `
      <div class="steps">${STAGES.map(([n], i) => `<div class="step ${i < stage ? "done" : i === stage && status === "running" ? "now" : ""}"><div class="b">${i < stage ? I("done") : ""}</div><span>${n}</span></div>`).join("")}</div>
      <div class="counts"><div><b>${live.length}</b><span>finished</span></div><div><b>${live.filter((t) => t.status === "ready").length}</b><span>ready to send</span></div><div><b>${job ? fmtTime(job.elapsed) : "—"}</b><span>elapsed</span></div></div>
      ${status === "error" ? `<div class="banner bad">${I("warn")}<div><b>The run stopped.</b><br>${esc(job ? job.error : "")}</div></div>` : ""}
      ${status === "cancelled" ? `<div class="banner warn">${I("warn")}<div>${esc(job.error)}</div></div>` : ""}
      <div class="actions">${d.has_inbox ? `<a class="btn fill" href="/runs/${encodeURIComponent(id)}/results.html">${I("inbox")}Open inbox${status === "running" ? " (so far)" : ""}</a>` : ""}
        ${status === "running" ? `<button class="btn danger" id="stop">${I("stop")}Stop</button>` : ""}<span class="grow"></span></div>
      ${live.length ? `<h2>Results so far</h2><div class="rows">${live.map((t) => `<a class="r" href="/runs/${encodeURIComponent(id)}/results.html">
        <div class="av" style="background:${colorOf(t.target)}">${esc(ini(t.target))}</div>
        <div class="main-col"><div class="t1">${esc(t.target)}${t.contact && t.contact !== "unknown" && t.contact !== t.target ? ` <span style="font-weight:400;color:var(--ink-3)">· ${esc(t.contact)}</span>` : ""}</div><div class="t2">${esc(t.hook)}</div></div>
        <span class="lb ${t.status === "ready" ? "ok" : "bad"}">${t.status === "ready" ? "Ready" : "Needs review"}</span><div class="side">${esc(t.channel)}</div></a>`).join("")}</div>` : ""}
      <details class="log" ${status === "error" ? "open" : ""}><summary>Activity log</summary><pre id="logpre">${esc(logText.trim() || "Starting…")}</pre></details>`;
    const pre = $("logpre"); pre.scrollTop = pre.scrollHeight;
    const stop = $("stop"); if (stop) stop.onclick = async () => { stop.disabled = true; try { await api(`/api/runs/${encodeURIComponent(id)}/cancel`, { method: "POST" }); } catch (e) { snack(e.message); } };
    if (status === "running") poll = setTimeout(tick, 1000); else refreshState();
  };
  tick();
}
const fmtTime = (s) => s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;

    <div class="actions"><button class="btn fill" id="savesender">Save sender</button>${ST.sender_ready ? `<span class="lb ok">${I("done", 'style="width:14px;height:14px"')}Complete</span>` : '<span class="lb warn">Incomplete</span>'}</div>
    <h2 style="margin-top:40px">API keys</h2>
    <label class="f" for="k-a">Anthropic API key ${ST.keys.anthropic ? `<span class="lb ok" style="margin-left:6px">Set: ${esc(ST.keys.anthropic)}</span>` : '<span class="lb warn" style="margin-left:6px">Not set</span>'}</label>
    <input class="t" id="k-a" type="password" placeholder="${ST.keys.anthropic ? "Paste a new key to replace it" : "sk-ant-…"}" autocomplete="off">
    <div class="help">Web search must be enabled for your organization in the Claude Console.</div>
    <label class="f" for="k-p">Apollo API key (optional) ${ST.keys.apollo ? `<span class="lb ok" style="margin-left:6px">Set</span>` : ""}</label>
    <input class="t" id="k-p" type="password" placeholder="Finds verified personal emails for named contacts" autocomplete="off">
    <div style="margin-top:14px"><label class="switch"><input type="checkbox" id="remember" checked><span>Remember on this computer (saved to .env, which git ignores)</span></label></div>
    <div class="actions"><button class="btn fill" id="savekeys">Save keys</button></div>`;
  let voice = s.voice || "investor";
  document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { voice = b.dataset.v; document.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
  $("savesender").onclick = async () => {
    const body = { voice }; ["name", "title", "firm", "email", "firm_address"].forEach((k) => body[k] = $("s-" + k).value);
    try { await api("/api/sender", { method: "PUT", body }); await refreshState(); pageSettings(); snack("Sender saved"); } catch (e) { snack(e.message); }
  };
  $("savekeys").onclick = async () => {
    const body = { anthropic: $("k-a").value, apollo: $("k-p").value, remember: $("remember").checked };
    if (!body.anthropic && !body.apollo) { snack("Paste a key first"); return; }
    try { const r = await api("/api/keys", { method: "POST", body }); await refreshState(); pageSettings(); snack(r.saved ? "Keys saved" : "Keys set for this session"); } catch (e) { snack(e.message); }
  };
}

// ---------- router ----------
async function render() {
  clearTimeout(poll);
  document.body.classList.remove("drawer");
  try { await refreshState(); } catch (e) { $("page").innerHTML = `<div class="banner bad">${I("warn")}<div>Can't reach the Outreach server. Is <code>python main.py --serve</code> still running?</div></div>`; return; }
  const [r, arg] = route();
  if (r === "runs" && arg) return pageRun(decodeURIComponent(arg));
  if (r === "runs") return pageRuns();
  if (r === "portfolio" && arg) return pageCompany(decodeURIComponent(arg));
  if (r === "portfolio") return pagePortfolio();
  if (r === "settings") return pageSettings();
  return pageNew();
}
window.addEventListener("hashchange", render);
$("menu").onclick = () => document.body.classList.toggle("drawer");
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const themeIcon = () => { $("theme").innerHTML = `<svg class="i" viewBox="0 0 24 24"><path d="${isDark() ? "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z" : "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"}"/></svg>`; };
$("theme").onclick = () => { document.documentElement.dataset.theme = isDark() ? "light" : "dark"; try { localStorage.setItem("outreach:theme", document.documentElement.dataset.theme); } catch (e) {} themeIcon(); };
try { const t = localStorage.getItem("outreach:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
themeIcon();
render();
})();
</script>
</body>
</html>
