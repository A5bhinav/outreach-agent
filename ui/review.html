<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b57d0'/%3E%3Cpath d='M7 25l20-9L7 7v7l14 2-14 2z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout and tokens follow Gmail's Material 3 web inbox, so the review step feels like the
   inbox the drafts will be sent from. */
:root {
  --bg: #f6f8fc; --surface: #ffffff; --read: #f2f6fc; --line: #e0e3e7; --line-2: #eceff1;
  --ink: #1f1f1f; --ink-2: #444746; --ink-3: #5e5e5e; --ink-4: #747775;
  --primary: #0b57d0; --primary-ink: #ffffff; --nav-sel: #d3e3fd; --nav-sel-ink: #001d35; --fab: #c2e7ff; --fab-ink: #001d35;
  --search: #e9eef6; --checked: #c2dbff; --draft: #d93025;
  --warn-bg: #fef7e0; --warn-ink: #7a4f01; --bad-bg: #fce8e6; --bad-ink: #a50e0e; --ok-bg: #e6f4ea; --ok-ink: #0d652d;
  --row-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
  --pop-shadow: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
  --sans: "Google Sans Text", "Google Sans", Roboto, Arial, sans-serif; --display: "Google Sans", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --surface: #1f1f1f; --read: #262626; --line: #3c4043; --line-2: #2e3134;
  --ink: #e3e3e3; --ink-2: #c4c7c5; --ink-3: #a8abaf; --ink-4: #8e918f;
  --primary: #a8c7fa; --primary-ink: #062e6f; --nav-sel: #004a77; --nav-sel-ink: #c2e7ff; --fab: #004a77; --fab-ink: #c2e7ff;
  --search: #28292a; --checked: #003a5c; --draft: #f28b82;
  --warn-bg: #3d2f0a; --warn-ink: #fdd663; --bad-bg: #3c1f1d; --bad-ink: #f6aea9; --ok-bg: #0f3d22; --ok-ink: #81c995;
  --row-shadow: inset 0 0 0 1px #3c4043; --pop-shadow: 0 4px 12px rgba(0,0,0,.6);
} }
:root[data-theme="dark"] {
  --bg: #111111; --surface: #1f1f1f; --read: #262626; --line: #3c4043; --line-2: #2e3134;
  --ink: #e3e3e3; --ink-2: #c4c7c5; --ink-3: #a8abaf; --ink-4: #8e918f;
  --primary: #a8c7fa; --primary-ink: #062e6f; --nav-sel: #004a77; --nav-sel-ink: #c2e7ff; --fab: #004a77; --fab-ink: #c2e7ff;
  --search: #28292a; --checked: #003a5c; --draft: #f28b82;
  --warn-bg: #3d2f0a; --warn-ink: #fdd663; --bad-bg: #3c1f1d; --bad-ink: #f6aea9; --ok-bg: #0f3d22; --ok-ink: #81c995;
  --row-shadow: inset 0 0 0 1px #3c4043; --pop-shadow: 0 4px 12px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/20px var(--sans); overflow: hidden; }
a { color: var(--primary); text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; }
.ib { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.ib:hover { background: rgba(68,71,70,.08); }
.ib.sm { width: 32px; height: 32px; } .ib.sm svg.i { width: 18px; height: 18px; }
.ib[disabled] { opacity: .38; pointer-events: none; }

/* ---------- header ---------- */
header { height: 64px; display: flex; align-items: center; padding: 8px 8px 8px 16px; gap: 4px; }
.logo { display: flex; align-items: center; gap: 8px; width: 222px; padding-left: 4px; }
.logo .mk { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #4285f4, #0b57d0); display: grid; place-items: center; }
.logo .mk svg { width: 18px; height: 18px; fill: #fff; }
.logo span { font: 22px/24px var(--display); color: var(--ink-2); letter-spacing: -.01em; }
.search { flex: 1; min-width: 0; max-width: 720px; height: 48px; border-radius: 24px; background: var(--search); display: flex; align-items: center; padding: 0 4px; }
.search:focus-within { background: var(--surface); box-shadow: 0 1px 1px 0 rgba(65,69,73,.3), 0 1px 3px 1px rgba(65,69,73,.15); }
.search input { flex: 1; border: 0; background: transparent; outline: none; font-size: 16px; padding: 0 8px; min-width: 0; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 4px; padding-right: 8px; }
.demo-chip { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); white-space: nowrap; }
.me { width: 32px; height: 32px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 500; margin-left: 4px; }

/* ---------- shell ---------- */
.shell { display: flex; height: calc(100vh - 64px); }
nav { width: 256px; flex: none; overflow-y: auto; padding-right: 16px; }
.fab { display: inline-flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px 0 16px; margin: 8px 0 16px 8px; border: 0; border-radius: 16px; background: var(--fab); color: var(--fab-ink); font: 500 14px var(--display); cursor: pointer; box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
.fab:hover { box-shadow: 0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15); }
.fab[disabled] { opacity: .5; box-shadow: none; cursor: default; }
.nv { display: flex; align-items: center; height: 32px; padding: 0 12px 0 26px; border-radius: 0 16px 16px 0; cursor: pointer; color: var(--ink); gap: 18px; user-select: none; }
.nv:hover { background: rgba(31,31,31,.06); }
.nv[aria-current="true"] { background: var(--nav-sel); color: var(--nav-sel-ink); font-weight: 700; }
.nv .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nv .cnt { font-size: 12px; letter-spacing: .3px; }
.navh { font: 500 16px/24px var(--display); padding: 16px 0 8px 26px; color: var(--ink); }
.runinfo { margin: 20px 0 0 26px; font-size: 12px; line-height: 18px; color: var(--ink-3); }
.runinfo b { color: var(--ink-2); font-weight: 500; }
.meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--primary); }
.ledger { display: none; margin: 14px 0 0 26px; padding: 12px; border-radius: 12px; background: var(--surface); font-size: 12px; line-height: 17px; color: var(--ink-2); }
.ledger.show { display: block; }
.ledger code { display: block; margin: 8px 0; padding: 8px; border-radius: 6px; background: var(--bg); font: 11px/15px ui-monospace, Menlo, monospace; word-break: break-all; color: var(--ink); }
.txtbtn { border: 0; background: none; color: var(--primary); font-weight: 500; cursor: pointer; padding: 6px 8px; margin-left: -8px; border-radius: 4px; }
.txtbtn:hover { background: rgba(11,87,208,.08); }

.split { flex: 1; min-width: 0; display: flex; }
.main { flex: 1; min-width: 0; background: var(--surface); border-radius: 16px; margin-bottom: 16px; display: flex; flex-direction: column; overflow: hidden; }
.rail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 8px; }
.rail .ib[aria-pressed="true"] { background: var(--nav-sel); color: var(--nav-sel-ink); }
.panel { width: 0; overflow: hidden; flex: none; }
.panel.open { width: 336px; padding-left: 16px; }
.panel .pin { width: 320px; height: calc(100% - 16px); background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }

/* ---------- toolbar ---------- */
.tb { height: 48px; flex: none; display: flex; align-items: center; padding: 0 8px 0 10px; gap: 2px; border-bottom: 1px solid var(--line-2); }
.tb .grow { flex: 1; }
.tb .pg { font-size: 12px; color: var(--ink-3); padding: 0 8px; white-space: nowrap; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }

/* ---------- list ---------- */
.list { flex: 1; overflow-y: auto; }
.row { display: flex; align-items: center; height: 40px; padding: 0 16px 0 10px; cursor: pointer; position: relative; box-shadow: inset 0 -1px 0 0 var(--line-2); background: var(--surface); }
.row.read { background: var(--read); }
.row.checked { background: var(--checked); }
.row:hover { box-shadow: var(--row-shadow); z-index: 1; }
.row.cursor::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); }
.row .ck, .row .st { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-4); flex: none; border: 0; background: none; cursor: pointer; padding: 0; }
.row .ck:hover, .row .st:hover { background: rgba(68,71,70,.1); color: var(--ink); }
.row .st.on { color: #f4b400; }
.row .who { width: 220px; flex: none; padding: 0 16px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who .co { font-weight: 400; color: var(--ink-3); }
.row .draft { color: var(--draft); }
.row .cnt-sub { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.row .subj { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; }
.row .snip { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.unread .who, .row.unread .subj, .row.unread .date { font-weight: 700; color: var(--ink); }
.row .date { width: 72px; flex: none; text-align: right; font-size: 12px; color: var(--ink-3); }
.row .acts { display: none; position: absolute; right: 8px; top: 4px; background: inherit; padding-left: 8px; }
.row:hover .acts { display: flex; } .row:hover .date { visibility: hidden; }
.lb { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 500; flex: none; line-height: 20px; }
.lb.email { background: #e8f0fe; color: #174ea6; } .lb.shared { background: #e6f4ea; color: #0d652d; }
.lb.li { background: #e1ecf7; color: #0a66c2; } .lb.form { background: #f3e8fd; color: #681da8; }
.lb.review { background: var(--bad-bg); color: var(--bad-ink); } .lb.sentlb { background: var(--ok-bg); color: var(--ok-ink); } .lb.plain { background: var(--line-2); color: var(--ink-2); }
:root[data-theme="dark"] .lb.email, :root[data-theme="dark"] .lb.shared, :root[data-theme="dark"] .lb.li, :root[data-theme="dark"] .lb.form { filter: brightness(.7) saturate(1.3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lb.email, :root:not([data-theme="light"]) .lb.shared, :root:not([data-theme="light"]) .lb.li, :root:not([data-theme="light"]) .lb.form { filter: brightness(.7) saturate(1.3); } }
.empty { padding: 64px 24px; text-align: center; color: var(--ink-3); }
.empty b { display: block; font: 400 22px var(--display); color: var(--ink-2); margin-bottom: 6px; }

/* ---------- reading view ---------- */
.read-view { flex: 1; overflow-y: auto; padding: 0 0 48px; }
.subject { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 20px 16px 8px 72px; }
.subject h2 { margin: 0; font: 400 22px/28px var(--display); color: var(--ink); }
.banner { margin: 8px 16px 8px 72px; padding: 12px 16px; border-radius: 8px; display: flex; gap: 12px; font-size: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); } .banner.bad { background: var(--bad-bg); color: var(--bad-ink); }
.banner.ok { background: var(--ok-bg); color: var(--ok-ink); }
.banner ul { margin: 4px 0 0; padding-left: 18px; } .banner b { font-weight: 500; }
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 16px; padding: 16px 16px 8px 16px; }
.msg + .msg { border-top: 1px solid var(--line-2); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 500 16px var(--display); }
.mh { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.mh .from { flex: 1; min-width: 0; }
.mh .from b { font-weight: 700; } .mh .addr { color: var(--ink-3); font-size: 12px; }
.mh .to { color: var(--ink-3); font-size: 12px; }
.mh .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
.mbody { white-space: pre-wrap; font: 14px/20px Arial, var(--sans); color: var(--ink); padding: 14px 0 6px; overflow-wrap: anywhere; max-width: 760px; }
.mfoot { white-space: pre-wrap; font: 12px/18px Arial, var(--sans); color: var(--ink-4); border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; max-width: 760px; }
.msg.collapsed .mbody, .msg.collapsed .mfoot, .msg.collapsed .pills, .msg.collapsed .meta-note { display: none; }
.msg.collapsed { cursor: pointer; } .msg.collapsed .snipline { display: block; }
.snipline { display: none; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pills { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 0 8px; }
.pill { height: 36px; padding: 0 20px 0 16px; border-radius: 18px; border: 1px solid var(--ink-4); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink-2); cursor: pointer; text-decoration: none; white-space: nowrap; }
.pill:hover { background: rgba(68,71,70,.08); }
.pill.fill { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.pill.fill:hover { filter: brightness(1.08); }
.pill svg.i { width: 18px; height: 18px; }
.meta-note { font-size: 12px; color: var(--ink-4); }

/* ---------- side panel ---------- */
.ph { height: 56px; display: flex; align-items: center; padding: 0 8px 0 20px; border-bottom: 1px solid var(--line-2); flex: none; }
.ph span { flex: 1; text-transform: uppercase; font: 500 12px var(--sans); letter-spacing: .8px; color: var(--ink-3); }
.pb { overflow-y: auto; padding: 4px 20px 24px; }
.sec { padding: 16px 0; border-bottom: 1px solid var(--line-2); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 10px; font: 500 14px var(--display); color: var(--ink); }
.score { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; } .score b { font: 400 28px var(--display); }
.score span { color: var(--ink-3); font-size: 13px; }
.crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 18px; }
.crit li { display: flex; gap: 8px; }
.crit svg.i { width: 18px; height: 18px; }
.crit .yes { color: #188038; } .crit .no { color: #d93025; } .crit .unclear { color: var(--ink-4); }
.kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px 8px; font-size: 13px; line-height: 18px; margin: 0; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts { list-style: none; margin: 0; padding: 0; font-size: 13px; line-height: 18px; }
.facts li { padding: 8px 0; } .facts li + li { border-top: 1px solid var(--line-2); }
.facts .m { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--line-2); color: var(--ink-2); }
.tag.ok { background: var(--ok-bg); color: var(--ok-ink); } .tag.bad { background: var(--bad-bg); color: var(--bad-ink); } .tag.blue { background: var(--nav-sel); color: var(--nav-sel-ink); }
.inline-panel { display: none; }

/* ---------- compose ---------- */
.compose { position: fixed; right: 80px; bottom: 0; width: 560px; max-height: calc(100vh - 80px); background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: var(--pop-shadow); display: none; flex-direction: column; z-index: 20; }
.compose.open { display: flex; }
.ch { height: 40px; flex: none; display: flex; align-items: center; padding: 0 4px 0 16px; background: var(--read); border-radius: 16px 16px 0 0; font-weight: 500; }
.ch span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cf { display: flex; align-items: center; gap: 8px; min-height: 40px; margin: 0 16px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
.cf input { flex: 1; border: 0; outline: none; background: transparent; color: var(--ink); padding: 8px 0; }
.cf .rcp { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb { flex: 1; overflow-y: auto; padding: 8px 16px; min-height: 220px; }
.cb textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; font: 14px/20px Arial, var(--sans); min-height: 200px; overflow: hidden; display: block; }
.cb .mfoot { margin-top: 4px; }
.cbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
.send { height: 36px; padding: 0 24px 0 18px; border-radius: 18px; border: 0; background: var(--primary); color: var(--primary-ink); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.send:hover { box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
.send[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.cbar .grow { flex: 1; }
.wc { font-size: 12px; color: var(--ink-3); }
.wc.off { color: var(--draft); }
.edited { display: none; font-size: 12px; color: var(--ink-3); } .edited.show { display: inline; }

.snack { position: fixed; left: 24px; bottom: 24px; background: #303030; color: #f2f2f2; padding: 14px 16px; border-radius: 4px; font-size: 14px; box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.14); transform: translateY(80px); opacity: 0; transition: .2s; z-index: 30; display: flex; gap: 24px; align-items: center; }
.snack.show { transform: none; opacity: 1; }
.snack button { border: 0; background: none; color: #a8c7fa; font-weight: 500; cursor: pointer; padding: 0; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: grid; place-items: center; z-index: 40; }
.scrim[hidden] { display: none; }
.dlg { background: var(--surface); border-radius: 28px; padding: 8px 24px 24px; width: min(480px, calc(100vw - 32px)); box-shadow: var(--pop-shadow); }
.dh { display: flex; align-items: center; height: 56px; font: 400 22px var(--display); } .dh span { flex: 1; }
.sc { display: grid; grid-template-columns: 140px 1fr; gap: 10px 16px; margin: 8px 0 0; font-size: 14px; } .sc dt { color: var(--ink-2); } .sc dd { margin: 0; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-3); }

/* ---------- responsive ---------- */
@media (max-width: 1180px) { .panel, .rail { display: none; } .main { margin-right: 16px; } .inline-panel { display: block; margin: 8px 16px 0 72px; border-top: 1px solid var(--line-2); } }
@media (max-width: 860px) {
  body { overflow: auto; }
  header { padding: 8px; } .logo { width: auto; } .logo span, .demo-chip, .me { display: none; }
  nav { position: fixed; z-index: 15; top: 0; bottom: 0; left: 0; background: var(--bg); transform: translateX(-100%); transition: .2s; box-shadow: var(--pop-shadow); padding-top: 8px; }
  body.drawer nav { transform: none; }
  .shell { height: auto; } .main { margin: 0 8px 8px; min-height: calc(100vh - 72px); }
  .row { height: auto; padding: 10px 44px 10px 12px; align-items: flex-start; flex-wrap: wrap; }
  .row .ck { display: none; } .row .who { width: auto; flex: 1; padding: 0 8px 0 0; } .row .date { width: auto; }
  .row .cnt-sub { flex-basis: 100%; order: 3; display: block; white-space: normal; }
  .row .cnt-sub .lb { margin-right: 4px; } .row .subj { max-width: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .snip { display: block; white-space: nowrap; } .row .snip .dash { display: none; }
  .row .st { position: absolute; right: 6px; top: 6px; }
  .row .acts { display: none !important; } .row:hover .date { visibility: visible; }
  .subject { padding-left: 16px; } .banner, .inline-panel { margin-left: 16px; }
  .compose { right: 0; left: 0; width: auto; top: 0; max-height: none; border-radius: 0; }
  .ch { border-radius: 0; }
  .tb .kbdhelp { display: none; }
}
</style>
</head>
<body>
<header>
