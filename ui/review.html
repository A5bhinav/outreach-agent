<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach review</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #fafbfc; --ink: #0f172a; --ink-2: #475569; --ink-3: #8a94a6;
  --line: #e6e8ec; --line-2: #eef0f3; --accent: #4f46e5; --accent-2: #eef0ff; --accent-ink: #ffffff;
  --ok: #157f3d; --ok-bg: #e9f8ef; --warn: #a15c07; --warn-bg: #fff6e5; --bad: #b42318; --bad-bg: #fdecea;
  --chip: #f1f3f6; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e13; --panel: #13161d; --panel-2: #171b23; --ink: #e7e9ef; --ink-2: #a5aec0; --ink-3: #6c7588;
    --line: #232836; --line-2: #1c202b; --accent: #8b93ff; --accent-2: #1e2140; --accent-ink: #0c0e13;
    --ok: #4ade80; --ok-bg: rgba(74,222,128,.1); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.1);
    --bad: #f87171; --bad-bg: rgba(248,113,113,.1); --chip: #1b1f2a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e13; --panel: #13161d; --panel-2: #171b23; --ink: #e7e9ef; --ink-2: #a5aec0; --ink-3: #6c7588;
  --line: #232836; --line-2: #1c202b; --accent: #8b93ff; --accent-2: #1e2140; --accent-ink: #0c0e13;
  --ok: #4ade80; --ok-bg: rgba(74,222,128,.1); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.1);
  --bad: #f87171; --bad-bg: rgba(248,113,113,.1); --chip: #1b1f2a; --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
svg { flex: none; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.run { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.run .req { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .meta { display: flex; gap: 6px; flex-wrap: wrap; color: var(--ink-3); font-size: 12px; }
.progress { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.bar { width: 120px; height: 6px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .25s; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--ink-2); }
.iconbtn:hover { background: var(--chip); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 340px minmax(0, 1fr) 360px; height: calc(100vh - 57px); }
.list { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.main { overflow: auto; padding: 22px 26px 40px; min-width: 0; }
.side { border-left: 1px solid var(--line); background: var(--panel-2); overflow: auto; padding: 20px 18px 40px; }

/* ---------- list ---------- */
.filters { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line-2); }
.seg { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 6px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.seg .n { color: var(--ink-3); font-weight: 500; margin-left: 3px; }
.search { position: relative; }
.search input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
.search svg { position: absolute; left: 9px; top: 9px; color: var(--ink-3); }
.items { overflow: auto; flex: 1; padding: 6px; }
.item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; padding: 10px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.item:hover { background: var(--panel-2); }
.item[aria-selected="true"] { background: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 13px; color: #fff; position: relative; }
.avatar .done { position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px; border-radius: 50%; background: var(--ok); border: 2px solid var(--panel); display: grid; place-items: center; }
.item .row1 { display: flex; align-items: center; gap: 6px; }
.item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.item .who { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .hook { color: var(--ink-3); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.item .tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.empty { padding: 30px 16px; text-align: center; color: var(--ink-3); }
.ledger { border-top: 1px solid var(--line); padding: 12px; font-size: 12.5px; color: var(--ink-2); display: none; }
.ledger.show { display: block; }
.ledger code { display: block; margin: 6px 0 8px; padding: 8px; background: var(--chip); border-radius: 6px; font: 11.5px/1.45 var(--mono); word-break: break-all; color: var(--ink); }

/* ---------- chips & pills ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 550; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.accent { background: var(--accent-2); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- detail ---------- */
.head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.head .avatar { width: 46px; height: 46px; font-size: 16px; }
.head h1 { margin: 0; font-size: 20px; letter-spacing: -.015em; line-height: 1.25; }
.head .sub { color: var(--ink-2); margin-top: 2px; }
.head .sub a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line); }
.head .grow { flex: 1; min-width: 0; }
.btn.back { display: none; }
.banner { display: flex; gap: 10px; padding: 11px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13.5px; }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink); }
.banner b { display: block; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: -1px; }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--ink-2); font-weight: 550; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow); }
.field { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--line-2); }
.field label { color: var(--ink-3); font-size: 12.5px; }
.field .val { display: flex; gap: 8px; align-items: center; min-width: 0; flex-wrap: wrap; }
.field input { border: 0; outline: none; background: transparent; width: 100%; font-weight: 550; padding: 2px 0; }
.body textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 16px; line-height: 1.6; font-size: 14.5px; min-height: 160px; overflow: hidden; }
.footer-lock { margin: 0 16px 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--ink-3); font-size: 12.5px; white-space: pre-wrap; }
.footer-lock .t { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); margin-bottom: 3px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--line-2); background: var(--panel-2); border-radius: 0 0 var(--radius) var(--radius); }
.toolbar .spacer { flex: 1; }
.count { font-size: 12px; color: var(--ink-3); }
.count.ok { color: var(--ok); } .count.warn { color: var(--warn); }
.edited { font-size: 12px; color: var(--accent); display: none; align-items: center; gap: 6px; }
.edited.show { display: inline-flex; }
.edited button { border: 0; background: none; color: var(--ink-3); cursor: pointer; text-decoration: underline; padding: 0; font-size: 12px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 550; font-size: 13px; white-space: nowrap; text-decoration: none !important; color: var(--ink); }
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sent { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.note { margin-top: 10px; color: var(--ink-3); font-size: 12.5px; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--ink-2); }

/* ---------- evidence ---------- */
.side h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 22px 0 10px; font-weight: 650; }
.side h2:first-child { margin-top: 2px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.fit { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ring { width: 44px; height: 44px; }
.fit b { font-size: 15px; } .fit span { color: var(--ink-3); font-size: 12.5px; display: block; }
.crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.crit li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 13px; }
.crit .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.ic.yes { background: var(--ok-bg); color: var(--ok); } .ic.no { background: var(--bad-bg); color: var(--bad); } .ic.unclear { background: var(--chip); color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; min-width: 0; overflow-wrap: break-word; word-break: break-word; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.facts li { padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
.facts li:last-child { border-bottom: 0; padding-bottom: 0; } .facts li:first-child { padding-top: 0; }
.facts .src { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--ink-3); }
.facts li.used { position: relative; }
.facts li.used::before { content: ""; position: absolute; left: -14px; top: 2px; bottom: 11px; width: 3px; border-radius: 3px; background: var(--accent); }
details.fixed { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
details.fixed summary { cursor: pointer; color: var(--ink-3); }
details.fixed ul { padding-left: 18px; margin: 6px 0 0; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.keys { color: var(--ink-3); font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .app { grid-template-columns: 320px minmax(0, 1fr); }
  .side { display: none; }
  .main .side-inline { display: block; }
}
.side-inline { display: none; margin-top: 26px; }
@media (max-width: 860px) {
  .top { padding: 10px 14px; gap: 10px; } .progress, .run .meta, .brand-name { display: none; }
  .run .req { font-size: 13px; }
  .app { display: block; height: auto; }
  .list { border-right: 0; min-height: calc(100vh - 57px); }
  .main { display: none; padding: 16px; }
  body.detail .list { display: none; } body.detail .main { display: block; }
  .btn.back { display: inline-flex; margin-bottom: 12px; }
  .field { grid-template-columns: 60px minmax(0, 1fr); padding: 9px 12px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></span><span class="brand-name">Outreach</span></div>
  <div class="run"><div class="req" id="req"></div><div class="meta" id="meta"></div></div>
  <div class="progress"><span id="progtxt"></span><div class="bar"><i id="progbar"></i></div></div>
  <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>
<div class="app">
  <aside class="list">
    <div class="filters">
      <div class="seg" role="group" aria-label="Filter" id="seg"></div>
      <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search targets, contacts, facts" aria-label="Search"></div>
    </div>
    <div class="items" id="items" role="listbox" aria-label="Targets"></div>
    <div class="ledger" id="ledger"></div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
const D = JSON.parse(document.getElementById("data").textContent);
const rows = D.rows, M = D.meta;
const KEY = "outreach:" + M.run;
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + ":" + k, JSON.stringify(v)); } catch (e) {} },
};
const state = { filter: store.get("filter", "all"), q: "", sel: 0, tab: {}, sent: store.get("sent", {}), edits: store.get("edits", {}) };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };
const words = (s) => (s.trim().match(/\S+/g) || []).length;
const COLORS = ["#4f46e5", "#0891b2", "#c2410c", "#7c3aed", "#15803d", "#be185d", "#0369a1", "#a16207"];
const color = (s) => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = (s) => s.replace(/[^A-Za-z0-9 &]/g, "").split(/\s+/).filter((w) => w && w !== "&").slice(0, 2).map((w) => w[0]).join("").toUpperCase();

const ICON = {
  mail: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  inbox: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
  li: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.84-2.05 3.79-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4-.03-3.2-1.95-3.2-1.95 0-2.25 1.52-2.25 3.1V21H9z"/></svg>',
  form: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  ext: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg>',
  copy: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  dl: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m5 12 5 5 9-10"/></svg>',
  lock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18 9 12l6-6"/></svg>',
};
const channelIcon = (ch) => ch === "LinkedIn note" ? ICON.li : ch === "contact form" ? ICON.form : ch.includes("shared") ? ICON.inbox : ICON.mail;
const channelLabel = (ch) => ({ "email": "Email", "email (shared inbox)": "Shared inbox", "LinkedIn note": "LinkedIn", "contact form": "Contact form", "none": "No channel" }[ch] || ch);
const isReady = (r) => r.status === "ready";
const isSent = (r) => !!state.sent[r.target];
const bucket = (r) => isSent(r) ? "sent" : isReady(r) ? "ready" : "review";
const statusChip = (r) => isSent(r) ? `<span class="chip ok">${ICON.check}Sent</span>`
  : isReady(r) ? `<span class="chip ok"><span class="dot"></span>Ready</span>` : `<span class="chip warn"><span class="dot"></span>Needs review</span>`;

// ---------- edits ----------
const draft = (r) => {
  const e = state.edits[r.target] || {};
  return { subject: e.subject ?? r.subject, body: e.body ?? r.body, followup: e.followup ?? r.followup_body, note: e.note ?? r.linkedin_note };
};
const isEdited = (r) => { const e = state.edits[r.target]; return !!e && Object.keys(e).length > 0; };
function edit(r, field, value) {
  const orig = { subject: r.subject, body: r.body, followup: r.followup_body, note: r.linkedin_note }[field];
  const e = state.edits[r.target] = state.edits[r.target] || {};
  if (value === orig) delete e[field]; else e[field] = value;
  if (!Object.keys(e).length) delete state.edits[r.target];
  store.set("edits", state.edits);
}
const fullBody = (r, body) => r.footer ? body.replace(/\s+$/, "") + "\n\n" + r.footer : body;
function gmail(to, subject, body) {
  const q = new URLSearchParams({ view: "cm", fs: "1", to, su: subject, body });
  if (M.account) q.set("authuser", M.account);
  return "https://mail.google.com/mail/?" + q.toString().replace(/\+/g, "%20");
}
function eml(r, subject, body) {
  const lines = [];
  if (r.to_email) lines.push("To: " + r.to_email);
  if (M.from) lines.push("From: " + M.from);
  lines.push("Subject: " + subject.replace(/\s+/g, " ").trim(), "X-Unsent: 1", "MIME-Version: 1.0",
             "Content-Type: text/plain; charset=utf-8", "Content-Transfer-Encoding: 8bit", "", body.replace(/\r?\n/g, "\r\n"));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "message/rfc822" }));
  a.download = r.target.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".eml";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(what + " copied");
}

// ---------- header ----------
function renderTop() {
  $("req").textContent = M.request;
  $("req").title = M.request;
  const chips = [M.demo ? '<span class="chip accent">Demo · fictional data</span>' : "",
    `<span>${esc(M.company)}</span>`, `<span>·</span><span>${M.mode === "people" ? "Finding people" : "Meeting companies"}</span>`,
    `<span>·</span><span>${esc(M.date)}</span>`];
  $("meta").innerHTML = chips.join("");
  const sent = rows.filter(isSent).length, ready = rows.filter(isReady).length;
  $("progtxt").textContent = `${sent} of ${ready} ready sent`;
  $("progbar").style.width = (ready ? 100 * sent / ready : 0) + "%";
}

// ---------- list ----------
function visible() {
  const q = state.q.trim().toLowerCase();
  return rows.map((r, i) => [r, i]).filter(([r]) => (state.filter === "all" || bucket(r) === state.filter) &&
    (!q || [r.target, r.company, r.contact_name, r.contact_title, r.fact_used, r.location].join(" ").toLowerCase().includes(q)));
}
function renderList() {
  const n = { all: rows.length, ready: 0, review: 0, sent: 0 };
  rows.forEach((r) => n[bucket(r)]++);
  $("seg").innerHTML = [["all", "All"], ["ready", "Ready"], ["review", "Review"], ["sent", "Sent"]].map(([k, l]) =>
    `<button data-f="${k}" aria-pressed="${state.filter === k}">${l}<span class="n">${n[k]}</span></button>`).join("");
  const vis = visible();
  $("items").innerHTML = vis.length ? vis.map(([r, i]) => `
    <div class="item" role="option" data-i="${i}" aria-selected="${i === state.sel}" tabindex="-1">
      <div class="avatar" style="background:${color(r.target)}">${esc(initials(r.target))}${isSent(r) ? `<span class="done">${ICON.check.replace('width="13" height="13"', 'width="9" height="9"').replace('currentColor', '#fff')}</span>` : ""}</div>
      <div style="min-width:0">
        <div class="row1"><span class="name">${esc(r.target)}</span></div>
        <div class="who">${esc(r.contact_name === r.target ? r.contact_title + (r.company !== r.target ? " · " + r.company : "")
          : r.contact_name !== "unknown" ? r.contact_name + " · " + r.contact_title : "No named contact")}</div>
        <div class="hook">${esc(r.fact_used)}</div>
        <div class="tags">${statusChip(r)}<span class="chip">${channelIcon(r.channel)}${channelLabel(r.channel)}</span>${isEdited(r) ? '<span class="chip accent">Edited</span>' : ""}</div>
      </div>
    </div>`).join("") : `<div class="empty">${rows.length ? "Nothing matches this filter." : "No targets in this run."}</div>`;
  const sent = rows.filter(isSent);
  const led = $("ledger");
  led.classList.toggle("show", sent.length > 0);
  if (sent.length) {
    const cmd = `python main.py --mark-sent "${M.outdir}" --only "${sent.map((r) => r.target.replace(/"/g, "")).join(",")}"`;
    led.innerHTML = `<b>${sent.length} marked sent here.</b> Record them in the shared ledger so they're never contacted twice:<code>${esc(cmd)}</code><button class="btn" id="cpled">${ICON.copy}Copy command</button>`;
    $("cpled").onclick = () => copy(cmd, "Ledger command");
  }
}

// ---------- detail ----------
function tabsFor(r) {
  const t = [];
  if (r.channel.startsWith("email") || r.channel === "contact form" || r.channel === "none") t.push(["email", r.channel === "contact form" ? "Message" : "Email"]);
  if (r.channel === "LinkedIn note" || (r.linkedin_note && r.channel === "none")) t.push(["note", "LinkedIn note"]);
  if (r.followup_body) t.push(["followup", "Follow-up"]);
  if (r.channel === "LinkedIn note" && r.body) t.push(["email", "Email version"]);
  return t;
}
function bannerHtml(r) {
  const checks = r.to_check === "none" ? [] : r.to_check.split(" | ");
  if (isSent(r)) return `<div class="banner ok">${ICON.ok}<div><b>Marked as sent</b>Follow up on ${esc(r.followup_send_after || "a few days")} if there's no reply.</div></div>`;
  if (isReady(r) && !checks.length) {
    const how = r.channel === "LinkedIn note" ? "Send it as a connection note from their profile."
      : r.channel === "contact form" ? "Paste it into their contact form; the legal footer is included."
      : r.email_kind === "generic" ? "It goes to a shared inbox and asks them to pass it to the right person; the legal footer is attached."
      : "The contact checks out and the legal footer is attached.";
    return `<div class="banner ok">${ICON.ok}<div><b>Ready to send</b>Every fact is sourced. ${how}</div></div>`;
  }
  const cls = isReady(r) ? "warn" : "bad";
  const title = isReady(r) ? "Ready, but worth a look" : "Not ready to send";
  // Blockers first and bold; a reason that isn't a reviewer flag (e.g. no channel) comes from the status.
  const block = checks.filter((c) => c.startsWith("BLOCKER")).map((c) => `<li><b style="display:inline">${esc(c.replace(/^BLOCKER:\s*/, ""))}</b></li>`);
  const rest = checks.filter((c) => !c.startsWith("BLOCKER")).map((c) => `<li>${esc(c)}</li>`);
  if (!isReady(r) && !block.length) block.push(`<li><b style="display:inline">${esc(r.status.replace(/^not ready:\s*/, ""))}</b></li>`);
  return `<div class="banner ${cls}">${ICON.warn}<div><b>${title}</b><ul>${block.join("")}${rest.join("")}</ul></div></div>`;
}
function counter(kind, text) {
  if (kind === "note") { const n = text.length; return `<span class="count ${n <= 300 ? "ok" : "warn"}">${n} / 300 characters</span>`; }
  const w = words(text), [lo, hi] = kind === "followup" ? [15, 60] : [50, 110];
  return `<span class="count ${w >= lo && w <= hi ? "ok" : "warn"}">${w} words · aim for ${lo}–${hi}</span>`;
}
function renderDetail() {
  const r = rows[state.sel];
  const main = $("main");
  if (!r) { main.innerHTML = '<div class="empty">Select a target</div>'; $("side").innerHTML = ""; return; }
  const tabs = tabsFor(r);
  let tab = state.tab[r.target] || (tabs[0] || [])[0];
  if (!tabs.some(([k]) => k === tab)) tab = (tabs[0] || [])[0];
  const d = draft(r);
  const self_ = r.contact_name === r.target;
  const sub = [r.contact_name !== "unknown" ? (self_ ? esc(r.contact_title) : `${esc(r.contact_name)}, ${esc(r.contact_title)}`) : "", r.company !== r.target ? esc(r.company) : "",
    esc(r.location), r.website && r.website.startsWith("http") ? `<a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(host(r.website))}</a>` : ""].filter(Boolean).join(" · ");
  let comp = "";
  if (tab === "email") {
    const to = r.channel === "contact form" ? `<a href="${esc(r.contact_form)}" target="_blank" rel="noopener">${esc(host(r.contact_form))}/…</a><span class="chip">${ICON.form}Contact form</span>`
      : r.to_email ? `<span>${esc(r.to_email)}</span><span class="chip ${r.email_kind === "generic" ? "warn" : "ok"}">${r.email_kind === "generic" ? "Shared inbox" : r.email_kind === "personal" ? "Personal" : "Address"}</span>`
      : '<span style="color:var(--ink-3)">No address found</span>';
    comp = `<div class="field"><label>To</label><div class="val">${to}</div></div>
      <div class="field"><label>Subject</label><div class="val"><input id="f-subject" value="${esc(d.subject)}" aria-label="Subject"></div></div>
      <div class="body"><textarea id="f-body" aria-label="Email body">${esc(d.body)}</textarea></div>
      ${r.footer ? `<div class="footer-lock"><div class="t">${ICON.lock}Added automatically (legal footer)</div>${esc(r.footer)}</div>` : ""}`;
  } else if (tab === "followup") {
    comp = `<div class="field"><label>When</label><div class="val">Send on <b>${esc(r.followup_send_after)}</b> if there's no reply, in the same thread</div></div>
      <div class="body"><textarea id="f-followup" aria-label="Follow-up">${esc(d.followup)}</textarea></div>`;
  } else if (tab === "note") {
    const prof = r.profile_link ? `<a href="${esc(r.profile_link)}" target="_blank" rel="noopener">${r.profile_link.includes("/search/") ? "Search LinkedIn" : esc(host(r.profile_link) + new URL(r.profile_link).pathname)}</a>` : "No profile link";
    comp = `<div class="field"><label>Profile</label><div class="val">${prof}<span class="chip">${ICON.li}Connection note</span></div></div>
      <div class="body"><textarea id="f-note" aria-label="LinkedIn note">${esc(d.note)}</textarea></div>`;
  }
  // Primary action for this tab, always using the edited text.
  const field = tab === "email" ? "body" : tab;
  let primary = "", secondary = "";
  if (tab === "email" && r.to_email) {
    primary = `<a class="btn primary" id="act" target="_blank" rel="noopener">${ICON.mail}Open in Gmail</a>`;
    secondary = `<button class="btn" id="cp">${ICON.copy}Copy</button><button class="btn" id="dl">${ICON.dl}.eml</button>`;
  } else if (tab === "email" && r.channel === "contact form") {
    primary = `<a class="btn primary" id="act" href="${esc(r.contact_form)}" target="_blank" rel="noopener">${ICON.form}Open contact form</a>`;
    secondary = `<button class="btn" id="cp">${ICON.copy}Copy message</button>`;
  } else if (tab === "followup") {
    primary = r.to_email ? `<a class="btn primary" id="act" target="_blank" rel="noopener">${ICON.mail}Open follow-up in Gmail</a>` : "";
    secondary = `<button class="btn${primary ? "" : " primary"}" id="cp">${ICON.copy}Copy follow-up</button>`;
  } else if (tab === "note") {
    primary = r.profile_link ? `<a class="btn primary" id="act" href="${esc(r.profile_link)}" target="_blank" rel="noopener">${ICON.li}Open profile</a>` : "";
    secondary = `<button class="btn" id="cp">${ICON.copy}Copy note</button>`;
  } else {
    secondary = `<button class="btn" id="cp">${ICON.copy}Copy</button>`;
  }
  main.innerHTML = `
    <button class="btn back" id="back">${ICON.back}All targets</button>
    <div class="head">
      <div class="avatar" style="background:${color(r.target)}">${esc(initials(r.target))}</div>
      <div class="grow"><h1>${esc(r.target)}</h1><div class="sub">${sub}</div></div>
      <button class="btn ${isSent(r) ? "sent" : ""}" id="sent" title="Mark as sent (s)">${ICON.check}${isSent(r) ? "Sent" : "Mark as sent"}</button>
    </div>
    ${bannerHtml(r)}
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join("")}</div>
    <div class="composer">${comp}
      <div class="toolbar">${primary}${secondary}<span class="spacer"></span>
        <span class="edited ${isEdited(r) ? "show" : ""}" id="edited">Edited · saved in this browser <button id="reset">Reset</button></span>
        <span id="cnt"></span></div>
    </div>
    <div class="keys"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>s</kbd> mark sent</span><span><kbd>e</kbd> edit</span><span><kbd>/</kbd> search</span><span><kbd>g</kbd> open</span></div>
    <div class="side-inline">${evidenceHtml(r)}</div>`;
  $("side").innerHTML = evidenceHtml(r);

  const ta = main.querySelector("textarea"), subj = $("f-subject");
  const val = () => ({ subject: subj ? subj.value : d.subject, text: ta ? ta.value : "" });
  const grow = () => { if (ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; } };
  const refresh = () => {
    const v = val();
    $("cnt").innerHTML = ta ? counter(tab === "email" ? "email" : tab, v.text) : "";
    const act = $("act");
    if (act && tab === "email" && r.to_email) act.href = gmail(r.to_email, v.subject, fullBody(r, v.text));
    if (act && tab === "followup" && r.to_email) act.href = gmail(r.to_email, "Re: " + v.subject, v.text);
  };
  grow(); refresh();
  if (ta) ta.oninput = () => { edit(r, field, ta.value); grow(); refresh(); $("edited").classList.add("show"); renderListLite(); };
  if (subj) subj.oninput = () => { edit(r, "subject", subj.value); refresh(); $("edited").classList.add("show"); renderListLite(); };
  $("reset").onclick = () => { delete state.edits[r.target]; store.set("edits", state.edits); render(); toast("Reverted to the reviewed draft"); };
  const cp = $("cp");
  if (cp) cp.onclick = () => {
    const v = val();
    if (tab === "email") copy(r.channel === "contact form" ? fullBody(r, v.text) : `Subject: ${v.subject}\n\n${fullBody(r, v.text)}`, "Email");
    else copy(v.text, tab === "note" ? "Note" : "Follow-up");
  };
  const dl = $("dl"); if (dl) dl.onclick = () => { const v = val(); eml(r, v.subject, fullBody(r, v.text)); };
  $("sent").onclick = () => toggleSent(r);
  $("back").onclick = () => document.body.classList.remove("detail");
  main.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { state.tab[r.target] = b.dataset.t; renderDetail(); });
}
function evidenceHtml(r) {
  const v = Object.entries(r.verdicts || {}), met = v.filter(([, x]) => x === "yes").length, pct = v.length ? met / v.length : 0;
  const ring = `<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--chip)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(pct * 94.2).toFixed(1)} 94.2" transform="rotate(-90 18 18)"/></svg>`;
  const mark = { yes: "✓", no: "✕", unclear: "?" };
  const fc = { yes: ["ok", "Found on source page"], NO: ["bad", "Not found on source page"], unchecked: ["", "Not checked"] }[r.fact_check] || ["", r.fact_check];
  const vf = r.contact_verified.startsWith("yes") ? ["ok", "Verified on source"] : r.contact_verified.startsWith("NO") ? ["bad", "Not on source page"]
    : r.contact_source.includes("linkedin.com") ? ["", "LinkedIn isn't fetched (by policy)"] : ["", "Page couldn't be checked"];
  const facts = (r.facts || []).map((f) => `<li class="${f.source_url === r.fact_source ? "used" : ""}">${esc(f.fact)}
      <div class="src"><span class="chip ${f.age_months != null && f.age_months <= 12 ? "ok" : ""}">${esc(f.date)}</span><a href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(host(f.source_url))} ${ICON.ext}</a>${f.source_url === r.fact_source ? '<span class="chip accent">Opener</span>' : ""}</div></li>`).join("");
  const contact = r.contact_name !== "unknown" ? `<dt>Contact</dt><dd>${esc(r.contact_name)}<br><span style="color:var(--ink-3)">${esc(r.contact_title)}</span></dd>
      <dt>Checked</dt><dd><span class="chip ${vf[0]}">${vf[1]}</span>${r.contact_source.startsWith("http") ? ` <a href="${esc(r.contact_source)}" target="_blank" rel="noopener">source ${ICON.ext}</a>` : ""}</dd>`
    : `<dt>Contact</dt><dd style="color:var(--ink-3)">No named person found</dd>`;
  const email = r.to_email ? `<dt>Email</dt><dd>${esc(r.to_email)}${r.email_source ? `<br><span style="color:var(--ink-3)">from ${r.email_source.startsWith("http") ? `<a href="${esc(r.email_source)}" target="_blank" rel="noopener">${esc(host(r.email_source))}</a>` : esc(r.email_source)}</span>` : ""}</dd>` : "";
  return `
    <h2>Why this target</h2>
    <div class="card"><div class="fit">${ring}<div><b>${met} of ${v.length} criteria</b><span>${esc(r.fit_reason)}</span></div></div>
      <ul class="crit">${v.map(([c, x]) => `<li><span class="ic ${x}">${mark[x] || "?"}</span><span>${esc(c)}</span></li>`).join("")}</ul></div>
    <h2>Why now</h2>
    <div class="card"><div style="font-size:13.5px">${esc(r.fact_used)}</div>
      <div class="facts"><div class="src" style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><span class="chip ${fc[0]}">${fc[1]}</span>${r.fact_source ? `<a style="font-size:12px" href="${esc(r.fact_source)}" target="_blank" rel="noopener">${esc(host(r.fact_source))} ${ICON.ext}</a>` : ""}</div></div></div>
    <h2>Contact</h2>
    <div class="card"><dl class="kv">${contact}${email}</dl></div>
    <h2>Research notes</h2>
    <div class="card"><ul class="facts">${facts || '<li style="color:var(--ink-3)">No notes</li>'}</ul>
      ${r.auto_fixed ? `<details class="fixed"><summary>Reviewer fixed ${r.auto_fixed.split(" | ").length} issue(s) in the draft</summary><ul>${r.auto_fixed.split(" | ").map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}</div>`;
}

// ---------- actions ----------
function toggleSent(r) {
  if (state.sent[r.target]) delete state.sent[r.target]; else state.sent[r.target] = new Date().toISOString().slice(0, 10);
  store.set("sent", state.sent);
  toast(state.sent[r.target] ? `Marked ${r.target} as sent` : "Unmarked");
  render();
}
function select(i) { state.sel = i; document.body.classList.add("detail"); render(); const el = document.querySelector(`.item[data-i="${i}"]`); if (el) el.scrollIntoView({ block: "nearest" }); }
function renderListLite() { const top = $("items").scrollTop; renderList(); $("items").scrollTop = top; }
function render() { renderTop(); renderListLite(); renderDetail(); }

$("seg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; state.filter = b.dataset.f; store.set("filter", state.filter); const v = visible(); if (v.length && !v.some(([, i]) => i === state.sel)) state.sel = v[0][1]; render(); };
$("q").oninput = (e) => { state.q = e.target.value; renderListLite(); };
$("items").onclick = (e) => { const it = e.target.closest(".item"); if (it) select(+it.dataset.i); };
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("outreach:theme", document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("outreach:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape" && typing) { document.activeElement.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = visible().map(([, i]) => i), pos = v.indexOf(state.sel);
  if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); if (v.length) select(v[Math.min(v.length - 1, pos + 1)]); }
  else if (e.key === "ArrowUp" || e.key === "k") { e.preventDefault(); if (v.length) select(v[Math.max(0, pos - 1)]); }
  else if (e.key === "s") toggleSent(rows[state.sel]);
  else if (e.key === "e") { e.preventDefault(); const t = $("main").querySelector("textarea"); if (t) t.focus(); }
  else if (e.key === "/") { e.preventDefault(); $("q").focus(); }
  else if (e.key === "g") { const a = $("act"); if (a && a.href) window.open(a.href, "_blank", "noopener"); }
});

const first = visible()[0];
state.sel = first ? first[1] : 0;
render();
document.body.classList.remove("detail");
})();
</script>
</body>
</html>
